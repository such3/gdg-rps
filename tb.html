<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tech Break Quiz</title>
<style>
:root{--bg:#f8f9fa;--surface:#fff;--text:#202124;--muted:#5f6368;--line:#dadce0;--blue:#4285f4;--red:#ea4335;--yellow:#fbbc04;--green:#34a853;--btn:#1a73e8;--btnText:#fff;--link:#1a73e8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202124;--surface:#2d2e31;--text:#e8eaed;--muted:#9aa0a6;--line:#3c4043;--btn:#8ab4f8;--btnText:#202124;--link:#8ab4f8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#202124;--surface:#2d2e31;--text:#e8eaed;--muted:#9aa0a6;--line:#3c4043;--btn:#8ab4f8;--btnText:#202124;--link:#8ab4f8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:16px/1.5 "Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand h1{font-size:1.1rem;margin:0;font-weight:600}
.dots{display:flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%}
.dots i:nth-child(1){background:var(--blue)}.dots i:nth-child(2){background:var(--red)}.dots i:nth-child(3){background:var(--yellow)}.dots i:nth-child(4){background:var(--green)}
button{font:inherit;cursor:pointer}
.ghost{background:none;color:var(--text);border:1px solid var(--line);border-radius:20px;padding:6px 14px}
.ghost:hover{background:var(--bg)}
.primary{background:var(--btn);color:var(--btnText);border:0;border-radius:32px;padding:14px 40px;font-size:clamp(1.1rem,2.2vw,1.5rem);font-weight:600}
.primary:disabled,.ghost:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{flex:1;display:flex;min-height:0}
aside{width:300px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:12px;flex-shrink:0}
aside .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--muted);font-size:.85rem}
.item{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:10px;border-left:4px solid var(--c)}
.item.cur{background:var(--bg)}
.item .t{flex:1;text-align:left;background:none;border:0;color:var(--text);padding:4px 0}
.item.off .t{opacity:.45;text-decoration:line-through}
.item .h{font-size:.8rem;padding:3px 10px}
main{flex:1;min-width:0;display:flex}
.wrap.nosb aside{display:none}
.card{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;text-align:center;background:var(--surface);padding:clamp(20px,5vw,64px);border-top:8px solid var(--c);overflow-y:auto}
.card>div,.card>h2,.card>pre,.card>ol{max-width:1000px;width:100%}
.meta{display:flex;justify-content:center;color:var(--muted);font-size:1rem;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--text)}
.chip:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
h2{font-size:clamp(1.3rem,min(4vw,5.5vh),3.2rem);line-height:1.25;margin:0 0 20px;font-weight:500}
.emoji{font-size:clamp(4rem,min(14vw,18vh),10rem);text-align:center;margin:8px 0 20px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;font:clamp(.9rem,min(2.2vw,3vh),1.5rem)/1.5 ui-monospace,Menlo,Consolas,monospace;margin:0 0 20px}
.codes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;margin-bottom:20px}
.codes pre{margin:0}
.card,aside{scrollbar-width:none}
.card::-webkit-scrollbar,aside::-webkit-scrollbar{display:none}
ol{margin:0 0 20px;padding-left:1.5em;text-align:left;font-size:clamp(1rem,min(2.6vw,3.6vh),1.9rem)}li{margin-bottom:10px}
.ans{background:#188038;color:#fff;border-radius:20px;padding:clamp(16px,3vw,32px);margin:20px 0;font-size:clamp(1.2rem,min(3.6vw,5vh),2.8rem);font-weight:600;line-height:1.3;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.ans b{display:block;font-size:1rem;text-transform:uppercase;letter-spacing:.1em;opacity:.9;margin-bottom:6px}
@keyframes pop{from{opacity:0;transform:scale(.5) translateY(40px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ans{animation:none}}
.nav{display:flex;gap:16px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.nav .ghost{font-size:1.1rem;padding:10px 24px}
.only-mobile{display:none}
.hint{color:var(--muted);font-size:.8rem;text-align:center;margin-top:16px}
@media (max-width:820px){
.only-mobile{display:inline-block}
aside{position:fixed;top:0;bottom:0;left:0;z-index:5;transform:translateX(-100%);transition:transform .2s;padding-top:calc(12px + env(safe-area-inset-top,0px));box-shadow:2px 0 12px rgba(0,0,0,.3)}
aside.open{transform:none}
}
</style>
</head>
<body>
<div class="app">
<header>
<button class="ghost" id="menu">☰ Questions</button>
<div class="brand"><span class="dots"><i></i><i></i><i></i><i></i></span><h1>Tech Break Quiz</h1></div>
<button class="ghost" id="fs">⛶ Fullscreen</button>
<button class="ghost" id="theme"></button>
</header>
<div class="wrap">
<aside id="side"></aside>
<main><div class="card" id="card"></div></main>
</div>
</div>
<script>
var Q=[
{t:"Trick",s:"Bread and eggs",q:"A programmer’s wife says: “Buy a loaf of bread. If they have eggs, buy 6.” He comes back with 6 loaves. Why?",a:"He read it as “if eggs exist, buy 6 of the bread”. Ambiguous instructions are how bugs are born."},
{t:"Riddle",s:"Keys but no locks",q:"I have keys but no locks, space but no room, and you can enter but never go outside. What am I?",a:"A keyboard (the Space bar and the Enter key)."},
{t:"Emoji",s:"Emoji: tech product",e:"🐙🐱",q:"Which tech product is this?",a:"GitHub, whose mascot is the Octocat."},
{t:"Emoji",s:"Emoji: programmer",e:"🐍🇳🇱",q:"Which programmer is this?",a:"Guido van Rossum, creator of Python (snake plus the Netherlands flag)."},
{t:"Spot the fake",s:"Spot the fake language",q:"Three of these are real programming languages. Which one was invented for this quiz?",code:`A)  HAI 1.2\n    VISIBLE "HELLO"\n    KTHXBYE\n\nB)  IT'S SHOWTIME\n    TALK TO THE HAND "hello"\n    YOU HAVE BEEN TERMINATED\n\nC)  PLEASE DO ,1 <- #13\n\nD)  NAMASTE DUNIYA\n    BOLO "hello"\n    CHALO BYE`,a:"D is the fake. A is LOLCODE, B is ArnoldC (Terminator quotes) and C is INTERCAL."},
{t:"Two truths",s:"Two truths: companies",q:"Which one is the lie?",list:["Google was originally called BackRub.","Amazon was originally called Cadabra.","Apple was founded by only two people."],a:"3 is the lie. Apple had three founders: Steve Jobs, Steve Wozniak and Ronald Wayne."},
{t:"Two truths",s:"Two truths: phones and Wi-Fi",q:"Which one is the lie?",list:["The first text message (SMS), sent in 1992, said “Merry Christmas”.","The first iPhone was released in 2007.","Wi-Fi stands for Wireless Fidelity."],a:"3 is the lie. Wi-Fi doesn’t stand for anything; a branding agency invented the name."},
{t:"Focus",s:"Count the F’s",q:"Count the F’s in this sentence. You get one try.",code:"FINISHED FILES ARE THE RESULT OF YEARS OF SCIENTIFIC STUDY COMBINED WITH THE EXPERIENCE OF YEARS",a:"There are 6. Most people say 3 because the brain skips the “OF”s."},
{t:"Nonsense",s:"Cloud and mud",q:"If a cloud server falls on the ground, does it become a mud server?",a:"Trick question: it makes no sense! Take a few serious answers first, then reveal it and cheer the funniest guess."},
{t:"Puzzle",s:"Truth and liar doors",q:"Two guards guard two doors. One always lies and one always tells the truth. You may ask one question to find the safe door. What do you ask?",a:"Ask either guard: “What would the other guard say is the safe door?” Then pick the opposite door."},
{t:"Puzzle",s:"8 balls, 1 heavier",q:"You have 8 balls, one slightly heavier, and a balance scale. What is the minimum number of weighings to find the heavy one?",a:"2. Weigh 3 against 3. If equal, weigh the remaining 2. If not, weigh 1 against 1 from the heavier group."},
{t:"Riddle",s:"Tabs I never close",q:"I have tabs I never close, a history I wish I could delete, and bookmarks I never open. What am I?",a:"A web browser."},
{t:"Trick",s:"1 + 1 in binary",q:"In binary, what is 1 + 1?",a:"10. Two is written as 10 in binary."}
];
var C={"Trick":"--red","Riddle":"--blue","Emoji":"--yellow","Spot the fake":"--green","Two truths":"--blue","Focus":"--yellow","Nonsense":"--red","Puzzle":"--green"};
var cur=0,shown=false,hid=new Set(),root=document.documentElement,side=document.getElementById("side"),card=document.getElementById("card"),tb=document.getElementById("theme");
function h(tag,cls,txt,par){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(par)par.appendChild(e);return e}
function col(t){return "var("+C[t]+")"}
function has(d){for(var j=cur+d;j>=0&&j<Q.length;j+=d)if(!hid.has(j))return j;return -1}
function go(i){cur=i;shown=false;side.classList.remove("open");render()}
function dark(){var a=root.getAttribute("data-theme");return a?a==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function setTheme(m){root.setAttribute("data-theme",m);try{localStorage.setItem("tbq-theme",m)}catch(e){}tb.textContent=dark()?"Light mode":"Dark mode"}
function render(){
side.textContent="";
var top=h("div","top",null,side),v=Q.length-hid.size;
h("span",null,v+" of "+Q.length+" shown",top);
var sa=h("button","ghost h","Show all",top);sa.disabled=!hid.size;sa.onclick=function(){hid.clear();render()};
Q.forEach(function(x,i){
var it=h("div","item"+(i===cur?" cur":"")+(hid.has(i)?" off":""),null,side);it.style.setProperty("--c",col(x.t));
var b=h("button","t",(i+1)+". "+x.s,it);b.onclick=function(){go(i)};
var hb=h("button","ghost h",hid.has(i)?"Show":"Hide",it);hb.setAttribute("aria-label",(hid.has(i)?"Show":"Hide")+" question "+(i+1));
hb.onclick=function(){hid.has(i)?hid.delete(i):hid.add(i);render()};
});
var x=Q[cur],vis=Q.map(function(_,i){return i}).filter(function(i){return !hid.has(i)}),pos=vis.indexOf(cur);
card.textContent="";card.style.setProperty("--c",col(x.t));
var m=h("div","meta",null,card),c=h("span","chip",x.t,m);

h("h2",null,x.q,card);
if(x.e)h("div","emoji",x.e,card);
if(x.code){var cw=h("div","codes",null,card);x.code.split("\n\n").forEach(function(b){h("pre",null,b,cw)})}
if(x.list){var ol=h("ol",null,null,card);x.list.forEach(function(s){h("li",null,s,ol)})}
var rb=h("button","primary",shown?"Hide answer":"Reveal answer",card);rb.onclick=function(){shown=!shown;render()};
if(shown){var an=h("div","ans",null,card);h("b",null,"Answer",an);h("span",null,x.a,an)}
var nv=h("div","nav",null,card),p=h("button","ghost","← Previous",nv),n=h("button","ghost","Next →",nv);
p.disabled=has(-1)<0;n.disabled=has(1)<0;
p.onclick=function(){go(has(-1))};n.onclick=function(){go(has(1))};

}
document.getElementById("menu").onclick=function(){if(matchMedia("(max-width:820px)").matches)side.classList.toggle("open");else document.querySelector(".wrap").classList.toggle("nosb")};
document.getElementById("fs").onclick=function(){try{var p=document.fullscreenElement?document.exitFullscreen():root.requestFullscreen();if(p&&p.catch)p.catch(function(){})}catch(e){}};
tb.onclick=function(){setTheme(dark()?"light":"dark")};
document.addEventListener("keydown",function(e){
if(e.key==="ArrowRight"&&has(1)>=0)go(has(1));
else if(e.key==="ArrowLeft"&&has(-1)>=0)go(has(-1));
else if((e.key==="r"||e.key==="R")&&!e.ctrlKey&&!e.metaKey){shown=!shown;render()}
});
try{var sv=localStorage.getItem("tbq-theme");if(sv)root.setAttribute("data-theme",sv)}catch(e){}
tb.textContent=dark()?"Light mode":"Dark mode";
render();
</script>
</body>
</html>
